# Publishes Poker Coach to GitHub Pages.
# Runs automatically when files change, or by hand: Actions tab → "Deploy Poker Coach" → Run workflow.
name: Deploy Poker Coach

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v7
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
